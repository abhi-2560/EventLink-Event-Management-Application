openapi: 3.1.0
info:
  title: Event Management Platform API
  version: 0.1.0
  description: REST API for the Event Management Platform. Registrants are anonymous;
    organizers and admins authenticate with JWT Bearer tokens. Refresh tokens are
    issued as HttpOnly cookies on login.
servers:
- url: http://localhost:5000
  description: Local Flask server
- url: /api
  description: Vite dev proxy prefix (stripped before Flask)
tags:
- name: Root
  description: API root
- name: Health
  description: Health and readiness
- name: Auth
  description: Authentication and password reset
- name: Public
  description: Public endpoints (no auth)
- name: Organizer
  description: Organizer-authenticated endpoints
- name: Admin
  description: Admin-authenticated endpoints
paths:
  /:
    get:
      operationId: getRoot
      summary: API root
      tags:
      - Root
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
      - Health
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOk'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailable'
      security: []
  /auth/login:
    post:
      operationId: authLogin
      summary: Unified login
      tags: &id001
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': &id002
          description: HTTP 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': &id003
          description: HTTP 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtErrorResponse'
        '422': &id004
          description: HTTP 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': &id005
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: Sets HttpOnly refresh token cookie (`refresh_token_admin` or `refresh_token_organizer`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedLoginBody'
  /auth/admin/login:
    post:
      operationId: authAdminLogin
      summary: Admin login
      tags: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': *id002
        '401': *id003
        '422': *id004
        '500': *id005
      description: Sets HttpOnly refresh token cookie (`refresh_token_admin` or `refresh_token_organizer`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
  /auth/organizer/login:
    post:
      operationId: authOrganizerLogin
      summary: Organizer login
      tags: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': *id002
        '401': *id003
        '422': *id004
        '500': *id005
      description: Sets HttpOnly refresh token cookie (`refresh_token_admin` or `refresh_token_organizer`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
  /auth/logout:
    post:
      operationId: authLogout
      summary: Unified logout
      tags: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': *id002
        '401': *id003
        '422': *id004
        '500': *id005
      description: Revokes refresh token cookie.
      security:
      - BearerAuth: []
  /auth/admin/logout:
    post:
      operationId: authAdminLogout
      summary: Admin logout
      tags: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': *id002
        '401': *id003
        '422': *id004
        '500': *id005
      description: Revokes refresh token cookie.
      security:
      - BearerAuth: []
  /auth/organizer/logout:
    post:
      operationId: authOrganizerLogout
      summary: Organizer logout
      tags: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': *id002
        '401': *id003
        '422': *id004
        '500': *id005
      description: Revokes refresh token cookie.
      security:
      - BearerAuth: []
  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Refresh access token
      tags: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': *id002
        '401': *id003
        '422': *id004
        '500': *id005
      description: Requires HttpOnly `refresh_token_{actor_type}` cookie. Rotates
        refresh token.
      security: []
      parameters:
      - name: X-Actor-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - admin
          - organizer
      - name: X-Refresh-Request
        in: header
        required: true
        schema:
          type: string
          enum:
          - '1'
  /auth/admin/forgot-password:
    post:
      operationId: authAdminForgotPassword
      summary: Admin forgot password
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: HTTP 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
  /auth/organizer/forgot-password:
    post:
      operationId: authOrganizerForgotPassword
      summary: Organizer forgot password
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: HTTP 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
  /auth/admin/reset-password:
    post:
      operationId: authAdminResetPassword
      summary: Admin reset password
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: HTTP 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: HTTP 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
  /auth/organizer/reset-password:
    post:
      operationId: authOrganizerResetPassword
      summary: Organizer reset password
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: HTTP 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: HTTP 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
  /auth/password-reset/request:
    post:
      operationId: authPasswordResetRequest
      summary: Unified password reset request
      tags: *id001
      responses:
        '200':
