          format: uuid
        description: Payment UUID
  /organizer/events:
    get:
      operationId: listOrganizerEvents
      summary: List own events
      tags: &id011
      - Organizer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventInternal'
        '401': &id012
          description: HTTP 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtErrorResponse'
        '403': &id013
          description: HTTP 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': &id014
          description: HTTP 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409': &id015
          description: HTTP 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422': &id016
          description: HTTP 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': &id017
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503': &id018
          description: HTTP 503
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: &id019
      - BearerAuth: []
    post:
      operationId: createOrganizerEvent
      summary: Create event
      tags: *id011
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventInternal'
        '401': *id012
        '403': *id013
        '404': *id014
        '409': *id015
        '422': *id016
        '500': *id017
        '503': *id018
      security: *id019
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
  /organizer/events/browse:
    get:
      operationId: browseOrganizerEvents
      summary: Browse all events
      tags: *id011
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401': *id012
        '403': *id013
        '404': *id014
        '409': *id015
        '422': *id016
        '500': *id017
        '503': *id018
      security: *id019
  /organizer/events/{event_id}:
    get:
      operationId: getOrganizerEvent
      summary: Get own event
      tags: *id011
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWithMedia'
        '401': *id012
        '403': *id013
        '404': *id014
        '409': *id015
        '422': *id016
        '500': *id017
        '503': *id018
      security: *id019
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
