      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOrganizerBody'
  /coupons/validate:
    post:
      operationId: validateCoupon
      summary: Validate coupon
      tags: *id006
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponValidateResponse'
        '422':
          description: HTTP 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - coupon_code
              - event_id
              properties:
                coupon_code:
                  type: string
                event_id:
                  type: string
                  format: uuid
                seat_count:
                  type: integer
                  minimum: 1
                  default: 1
  /registrations:
    post:
      operationId: createRegistration
      summary: Create registration
      tags: *id006
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCreated'
        '404': *id007
        '409': *id008
        '422': *id009
        '500': *id010
      description: Reserves seats for 15 minutes and creates a payment order.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCreate'
  /registrations/{registration_id}:
