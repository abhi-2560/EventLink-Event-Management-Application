components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from login response (`access_token`).
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    JwtErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          example: Authentication is required
        reason:
          type: string
          example: Token has expired
    MessageResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    TokenResponse:
      type: object
      required:
      - access_token
      - actor_type
      - expires_in
      properties:
        access_token:
          type: string
        actor_type:
          type: string
          enum:
          - admin
          - organizer
        expires_in:
          type: integer
          example: 900
      example:
        access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        actor_type: organizer
        expires_in: 900
    Admin:
      type: object
      properties:
        admin_id: &id031
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
        last_login: &id033
          type:
          - string
          - 'null'
          format: date-time
        created_at: &id032
          type: string
          format: date-time
    Organizer:
      type: object
      properties:
        organizer_id: *id031
        organizer_name:
          type: string
        contact_person:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          type: string
        total_events:
          type: integer
        active_events:
          type: integer
        total_registrations:
          type: integer
        total_tickets_sold:
          type: integer
        total_sales: &id034
          type: string
          example: '100.00'
        created_at: *id032
        archived_at: *id033
    Category:
      type: object
      properties:
        category_id: *id031
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        is_default:
          type: boolean
        total_events:
          type: integer
        total_registrations:
          type: integer
        total_tickets_sold:
          type: integer
        total_sales: *id034
    Event:
      type: object
      properties:
        event_id: *id031
        organizer_id: &id035
          type:
          - string
          - 'null'
          format: uuid
        organizer_name: &id036
          type: string
        category_id: &id037
          type:
          - string
          - 'null'
          format: uuid
        category_name: &id038
          type: string
        title: &id039
          type: string
        description: &id040
          type: string
        event_type: &id041
          type: string
          enum:
          - ONLINE
          - OFFLINE
          - HYBRID
        venue: &id042
          type: string
        city: &id043
          type: string
        state: &id044
          type: string
        country: &id045
          type: string
        meeting_link: &id046
          type:
          - string
          - 'null'
        keywords: &id047
          type: array
          items:
            type: string
        ticket_price: *id034
        is_free: &id048
          type: boolean
        convenience_fee: *id034
        gateway_fee: *id034
        capacity: &id049
          type: integer
        available_seats: &id050
          type: integer
        registration_start: *id033
        registration_end: *id033
        start_datetime: *id033
        status: &id051
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - ARCHIVED
        registration_status: &id052
          type: string
          enum:
          - OPEN
          - CLOSED
        banner_url: &id053
          type:
          - string
          - 'null'
    EventInternal:
      type: object
      properties:
        event_id: *id031
        organizer_id: *id035
        organizer_name: *id036
        category_id: *id037
        category_name: *id038
        title: *id039
        description: *id040
        event_type: *id041
        venue: *id042
        city: *id043
        state: *id044
        country: *id045
        meeting_link: *id046
        keywords: *id047
        ticket_price: *id034
        is_free: *id048
        convenience_fee: *id034
        gateway_fee: *id034
        capacity: *id049
        available_seats: *id050
        registration_start: *id033
        registration_end: *id033
        start_datetime: *id033
        status: *id051
        registration_status: *id052
        banner_url: *id053
        organizer_email:
          type: string
        organizer_phone:
          type: string
        total_registrations:
          type: integer
        total_tickets_sold:
          type: integer
        total_sales: *id034
        created_at: *id032
        archived_at: *id033
    EventWithMedia:
      type: object
      properties:
        event_id: *id031
        organizer_id: *id035
        organizer_name: *id036
        category_id: *id037
        category_name: *id038
        title: *id039
