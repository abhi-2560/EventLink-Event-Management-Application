      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
  /auth/register/organizer:
    post:
      operationId: authRegisterOrganizer
      summary: Register organizer (auth)
      tags: *id001
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizer'
        '409':
          description: HTTP 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: HTTP 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
