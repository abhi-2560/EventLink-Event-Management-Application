      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOrganizerBody'
  /events:
    get:
      operationId: listPublicEvents
      summary: List published events
      tags: &id006
      - Public
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '404': &id007
          description: HTTP 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409': &id008
          description: HTTP 409
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422': &id009
          description: HTTP 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': &id010
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /events/search:
    get:
      operationId: searchPublicEvents
      summary: Search published events
      tags: *id006
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '404': *id007
        '409': *id008
        '422': *id009
        '500': *id010
      security: []
      parameters:
      - name: title
        in: query
        required: false
        description: Title filter
        schema:
          type: string
      - name: city
        in: query
        required: false
        description: City filter
        schema:
          type: string
      - name: location
        in: query
        required: false
        description: Alias for city
        schema:
          type: string
      - name: category_id
        in: query
        required: false
        description: Category UUID
        schema:
          type: string
          format: uuid
      - name: category
        in: query
        required: false
        description: Category name
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: Event type
        schema:
          type: string
          enum:
          - ONLINE
          - OFFLINE
          - HYBRID
      - name: organizer
        in: query
        required: false
        description: Organizer name
        schema:
          type: string
      - name: keyword
        in: query
        required: false
        description: Keyword match
        schema:
          type: string
      - name: date
        in: query
        required: false
        description: Single-day filter
        schema:
          type: string
          format: date-time
      - name: date_from
        in: query
        required: false
        description: Range start
        schema:
          type: string
          format: date-time
      - name: date_to
        in: query
        required: false
        description: Range end
        schema:
          type: string
          format: date-time
  /events/{event_id}:
    get:
      operationId: getPublicEvent
      summary: Get published event
      tags: *id006
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWithMedia'
        '404': *id007
        '409': *id008
        '422': *id009
        '500': *id010
      security: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Event UUID
  /organizers/register:
    post:
      operationId: publicRegisterOrganizer
      summary: Register organizer (public)
      tags: *id006
      responses:
        '201':
          description: Created
          content:
