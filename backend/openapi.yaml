                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: HTTP 422
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
  /auth/password-reset/confirm:
    post:
      operationId: authPasswordResetConfirm
      summary: Unified password reset confirm
      tags: *id001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: HTTP 404
          content:
            application/json:
              schema:
